<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 220px;
      padding: 12px;
      margin: 0;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 10px 0;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    button:hover {
      background: #f5f5f5;
    }
    button:last-of-type {
      margin-bottom: 0;
    }
    #status {
      font-size: 12px;
      color: #c00;
      margin-top: 8px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h2>Full Page Screenshot</h2>
  <button id="visible">Capture visible area</button>
  <button id="full">Capture full page</button>
  <div id="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
